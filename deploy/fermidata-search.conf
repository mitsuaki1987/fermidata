# fermidata 検索アプリ (ネイティブ構成)
#   /fermidata/search/      : Vue の静的ビルド成果物 (app/dist を rsync)
#   /fermidata/search/api/  : Express + Prisma (fermidata-api.service, 127.0.0.1:3000)
# ProxyPass を Directory より先に置くこと。より長いプレフィックスのみが転送される。

ProxyPreserveHost On
ProxyPass        /fermidata/search/api/ http://127.0.0.1:3000/ retry=0
ProxyPassReverse /fermidata/search/api/ http://127.0.0.1:3000/

<Directory /var/www/html/fermidata/search>
    Require all granted
    Options -Indexes
    # vue-router の history モード用: 実ファイルが無いパスは index.html に落とす
    FallbackResource /fermidata/search/index.html
</Directory>
