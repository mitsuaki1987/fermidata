# /var/www/html/fermidata/ は git の作業ツリーそのものなので、公開すべきでない
# ファイルが公開ディレクトリに同居している。公開するのは静的な物質ページ
# (html/ gnuplot/ band/ j2s/ idioma/ js/ scfin/ scfout/ JSmol.min.js) と
# 検索アプリ (search/) だけで、リポジトリの中身は配信しない。
#
# ソースやツールのディレクトリを新しく追加した場合は、ここにも追記すること。

# ドットで始まるファイルを全階層で拒否 (.gitignore, .env など)
<Directory /var/www/html/fermidata>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <Files "readme.md">
        Require all denied
    </Files>
</Directory>

# ドットで始まるディレクトリの配下を拒否 (.git/config など)
<DirectoryMatch "^/var/www/html/fermidata/(.*/)?\.">
    Require all denied
</DirectoryMatch>

# リポジトリのソース・設定・ドキュメントのディレクトリ
<DirectoryMatch "^/var/www/html/fermidata/(api|app|deploy|doc)(/|$)">
    Require all denied
</DirectoryMatch>
